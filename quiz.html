<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - CHEMICALS IN DAILY LIFE</title>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at center, #0d1527 0%, #040814 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-primary); min-height: 100vh; }

        nav {
            display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 2rem;
            background: rgba(4, 8, 20, 0.5); backdrop-filter: blur(12px); border-bottom: 1px solid var(--glass-border);
        }
        .logo { font-size: 1.4rem; font-weight: 800; letter-spacing: 2px; }
        .nav-links { display: flex; list-style: none; gap: 2rem; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-weight: 500; }
        .nav-links a:hover, .nav-links .active { color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.6); }

        .quiz-container { max-width: 700px; margin: 4rem auto; padding: 2rem; }
        .quiz-box {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px;
            padding: 2.5rem; backdrop-filter: blur(15px); position: relative;
            transform-style: preserve-3d; transition: transform 0.3s;
        }

        /* Timer UI Elements */
        .timer-bar {
            width: 100%; height: 6px; background: rgba(255,255,255,0.1); 
            border-radius: 3px; margin-bottom: 1.5rem; overflow: hidden;
        }
        .timer-fill {
            height: 100%; width: 100%; background: linear-gradient(90deg, #3b82f6, #ef4444);
            transition: width 1s linear;
        }

        .meta-info { display: flex; justify-content: space-between; margin-bottom: 1rem; color: #3b82f6; font-weight: 600; }

        .question-text { font-size: 1.4rem; margin-bottom: 2rem; line-height: 1.5; color: #fff; }
        .options-list { display: flex; flex-direction: column; gap: 1rem; }
        .option-btn {
            background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border);
            padding: 1rem 1.5rem; text-align: left; color: #fff; font-size: 1.05rem;
            border-radius: 8px; cursor: pointer; transition: all 0.2s;
        }
        .option-btn:hover { background: rgba(59, 130, 246, 0.15); border-color: #3b82f6; }
        
        .score-screen { text-align: center; display: none; }
        .score-screen h2 { font-size: 2.5rem; margin-bottom: 1rem; }
        .score-screen p { font-size: 1.2rem; color: var(--text-secondary); margin-bottom: 2rem; }
        .restart-btn {
            padding: 0.8rem 2rem; background: #3b82f6; border: none; color: #fff;
            border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem;
        }
        .restart-btn:hover { background: #2563eb; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">CHEMICALS IN DAILY LIFE</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="chemicals.html">Chemicals</a></li>
            <li><a href="quiz.html" class="active">Quiz</a></li>
            <li><a href="about.html">About Us</a></li>
        </ul>
    </nav>

    <div class="quiz-container">
        <div class="quiz-box" id="quizBox">
            <div id="playArea">
                <div class="meta-info">
                    <span id="questionNum">Question 1/10</span>
                    <span id="timerText">Time Left: 15s</span>
                </div>
                <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
                <div class="question-text" id="questionText">Loading query context...</div>
                <div class="options-list" id="optionsList"></div>
            </div>

            <div class="score-screen" id="scoreScreen">
                <h2>Quiz Completed!</h2>
                <p id="scoreText">Your performance metrics will load here.</p>
                <button class="restart-btn" onclick="restartQuiz()">Try Again</button>
            </div>
        </div>
    </div>

    <script>
        const quizData = [
            { q: "Which compound prevents table salt from clumping together in humid environments?", a: ["Calcium silicate", "Sodium hydroxide", "Acetic acid", "Sodium benzoate"], correct: 0 },
            { q: "How does the food preservative Sodium Benzoate primarily inhibit cellular microbial growth?", a: ["By elevating system pH", "By cell membrane penetration & acidifying interior", "By instant oxidation burning", "By metal ion chelation"], correct: 1 },
            { q: "What active chemical compound cuts through grease efficiently in window cleaners?", a: ["Hydrochloric acid", "Sodium hypochlorite", "Ammonium hydroxide", "Calcium carbonate"], correct: 2 },
            { q: "Liquid household laundry bleach relies on which oxidizing chemical compound?", a: ["Sodium chloride", "Sodium hypochlorite", "Sodium bicarbonate", "Sodium sulfate"], correct: 1 },
            { q: "What structural gas product causes bakery mixtures to rise when baking soda is activated?", a: ["Oxygen", "Hydrogen", "Nitrogen", "Carbon dioxide"], correct: 3 },
            { q: "Which chemical compound is the primary active structural component of standard nail polish removers?", a: ["Methanol", "Acetone", "Benzene", "Glycerol"], correct: 1 },
            { q: "What organic acid gives vinegar its signature sour profile and pungent aroma?", a: ["Citric acid", "Lactic acid", "Acetic acid", "Sulfuric acid"], correct: 2 },
            { q: "What primary chemical compound constitutes common blackboard chalk and antacid tablets?", a: ["Calcium carbonate", "Sodium nitrate", "Magnesium sulfate", "Silicon dioxide"], correct: 0 },
            { q: "Which basic central nervous system stimulant compound naturally resides inside coffee beans?", a: ["Theobromine", "Caffeine", "Nicotine", "Morphine"], correct: 1 },
            { q: "Which combustible hydrocarbon gas fuels typical portable pocket lighters?", a: ["Methane", "Ethane", "Propane", "Butane"], correct: 3 }
        ];

        let currentIdx = 0;
        let score = 0;
        let timeLeft = 15;
        let timerInterval;

        const playArea = document.getElementById('playArea');
        const scoreScreen = document.getElementById('scoreScreen');
        const qText = document.getElementById('questionText');
        const optsList = document.getElementById('optionsList');
        const qNum = document.getElementById('questionNum');
        const tText = document.getElementById('timerText');
        const tFill = document.getElementById('timerFill');

        function startTimer() {
            timeLeft = 15;
            tText.textContent = `Time Left: ${timeLeft}s`;
            tFill.style.width = '100%';
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                tText.textContent = `Time Left: ${timeLeft}s`;
                tFill.style.width = `${(timeLeft / 15) * 100}%`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleAnswer(-1); // Process as incorrect/timeout
                }
            }, 1000);
        }

        function loadQuestion() {
            if (currentIdx >= quizData.length) {
                showResults();
                return;
            }
            
            startTimer();
            const currentQuestion = quizData[currentIdx];
            qNum.textContent = `Question ${currentIdx + 1}/${quizData.length}`;
            qText.textContent = currentQuestion.q;
            optsList.innerHTML = '';

            currentQuestion.a.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => handleAnswer(index);
                optsList.appendChild(btn);
            });
        }

        function handleAnswer(selectedIdx) {
            clearInterval(timerInterval);
            if (selectedIdx === quizData[currentIdx].correct) {
                score++;
            }
            currentIdx++;
            loadQuestion();
        }

        function showResults() {
            playArea.style.display = 'none';
            scoreScreen.style.display = 'block';
            document.getElementById('scoreText').textContent = `You scored ${score} out of ${quizData.length} correct concepts!`;
        }

        function restartQuiz() {
            currentIdx = 0;
            score = 0;
            playArea.style.display = 'block';
            scoreScreen.style.display = 'none';
            loadQuestion();
        }

        // Initialize quiz view frame
        loadQuestion();
    </script>
</body>
</html>
