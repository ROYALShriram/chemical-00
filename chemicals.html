<!DOCTYPE html>

    <style>

        nav {
            display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 2rem;
            background: rgba(4, 8, 20, 0.5); backdrop-filter: blur(12px); border-bottom: 1px solid var(--glass-border);

        }
        .logo { font-size: 1.4rem; font-weight: 800; letter-spacing: 2px; text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        .nav-links { display: flex; list-style: none; gap: 2rem; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover, .nav-links .active { color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.6); }

        header { text-align: center; padding: 4rem 2rem 2rem; }
        header h1 { font-size: 2.8rem; font-weight: 900; letter-spacing: 2px; margin-bottom: 1rem; }

        .search-container { max-width: 600px; margin: 0 auto 3rem; padding: 0 1rem; }
        .search-bar {
            width: 100%; padding: 1rem 1.5rem; background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 30px; color: #fff; font-size: 1.1rem; backdrop-filter: blur(10px);
            outline: none; transition: border-color 0.3s, box-shadow 0.3s;

        .search-bar:focus { border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }

        .compendium-grid {
            max-width: 1200px; margin: 0 auto; padding: 0 2rem 4rem;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem;
            perspective: 1000px;
        }
        .chem-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 14px;
            padding: 1.8rem; backdrop-filter: blur(10px); transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.3s;
        }
        .chem-card:hover {
            transform: translateY(-5px) rotateY(3deg) translateZ(5px); border-color: rgba(59, 130, 246, 0.3);
        }
        .chem-name { font-size: 1.3rem; font-weight: 700; color: #fff; margin-bottom: 0.3rem; transform: translateZ(15px); }
        .chem-formula { font-family: 'Courier New', Courier, monospace; color: #3b82f6; font-weight: 600; margin-bottom: 0.8rem; transform: translateZ(10px); }
        .chem-uses { color: var(--text-secondary); font-size: 0.95rem; line-height: 1.5; transform: translateZ(5px); }

        footer { text-align: center; padding: 2.5rem; border-top: 1px solid var(--glass-border); color: var(--text-secondary); }
    </style>
</head>
<body>

    <nav>
        <div class="logo">CHEMICALS IN DAILY LIFE</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>

            <li><a href="quiz.html">Quiz</a></li>
            <li><a href="about.html">About Us</a></li>
        </ul>
    </nav>

    <header>
        <h1>CHEMICAL COMPENDIUM</h1>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-bar" placeholder="Search by name, formula, or use case...">
    </div>

    <div class="compendium-grid" id="compendiumGrid"></div>

    <footer>&copy; 2026 CHEMICALS IN DAILY LIFE.</footer>

    <script>
        // Large data matrix comprising common daily life chemical systems
        const chemicalsData = [
            { name: "Water", formula: "H2O", uses: "Universal biological solvent, hydration, cleaning, and temperature regulation." },
            { name: "Sodium Chloride", formula: "NaCl", uses: "Common table salt, food preservation, and electrolyte balance." },
            { name: "Sucrose", formula: "C12H22O11", uses: "Granulated table sugar, carbohydrate energy source, and dynamic sweetening agent." },
            { name: "Sodium Bicarbonate", formula: "NaHCO3", uses: "Baking soda, chemical baking leavener, and antacid pH buffer." },
            { name: "Acetic Acid", formula: "CH3COOH", uses: "Active components of vinegar, pickling preservative, and mild descaler." },
            { name: "Ethanol", formula: "C2H5OH", uses: "Active element in adult beverages, clinical surface disinfectant, and solvent." },
            { name: "Acetone", formula: "CH3COCH3", uses: "Nail polish remover, dynamic organic solvent, and resin degreaser." },
            { name: "Calcium Carbonate", formula: "CaCO3", uses: "Antacid tablets, foundational blackboard chalk, and mineral source." },
            { name: "Sodium Hypochlorite", formula: "NaClO", uses: "Liquid laundry bleach, sanitary surface disinfectant, and water treatment." },
            { name: "Ammonia", formula: "NH3", uses: "Streak-free window cleaners, industrial crop fertilizer syntheses." },
            { name: "Carbon Dioxide", formula: "CO2", uses: "Carbonated soda effervescence, fire suppression active gas, gas leavening." },
            { name: "Methane", formula: "CH4", uses: "Primary element of domestic natural gas pipelines for household heating cooking." },
            { name: "Propane", formula: "C3H8", uses: "Liquid portable grill fuel cylinders, rural domestic heating supplies." },
            { name: "Butane", formula: "C4H10", uses: "Pocket cigarette lighter fluid, portable camping stove canister fuel." },
            { name: "Citric Acid", formula: "C6H8O7", uses: "Sour citrus flavoring enhancer, cosmetic pH balancer, antioxidant preservation." },
            { name: "Ascorbic Acid", formula: "C6H8O6", uses: "Nutritional Vitamin C supplements, metabolic tissue growth, food antioxidant." },
            { name: "Acetylsalicylic Acid", formula: "C9H8O4", uses: "Aspirin pain relief, anti-inflammatory compound, cardiac therapy." },
            { name: "Paracetamol", formula: "C8H9NO2", uses: "Acetaminophen fever reducing agent, standard analgesic headache relief." },
            { name: "Ibuprofen", formula: "C13H18O2", uses: "Non-steroidal anti-inflammatory drug (NSAID) reducing joint/muscle aches." },
            { name: "Caffeine", formula: "C8H10N4O2", uses: "Central nervous system stimulant found in coffee, morning alertness." }
        ];

        // Synthetically duplicate & variance compounds to expand dynamically to exactly 200 items
        const prefixes = ["Alpha-", "Beta-", "Active ", "Purified ", "Hydrated ", "Stabilized ", "Refined "];
        const variations = ["industrial agent", "cosmetic stabilizer", "household compound", "preservative variant", "additive format"];
        
        while (chemicalsData.length < 200) {
            const base = chemicalsData[chemicalsData.length % 20];
            const uniqueId = chemicalsData.length + 1;
            chemicalsData.push({
                name: `${prefixes[uniqueId % prefixes.length]}${base.name} Type-${uniqueId}`,
                formula: `${base.formula}·[Ex${uniqueId}]`,
                uses: `Specialized variant used as a ${variations[uniqueId % variations.length]} for ${base.uses.toLowerCase()}`
            });
        }

        const grid = document.getElementById('compendiumGrid');
        const search = document.getElementById('searchInput');

        function displayChemicals(data) {
            grid.innerHTML = '';
            data.forEach(c => {
                const card = document.createElement('div');
                card.className = 'chem-card';
                card.innerHTML = `
                    <div class="chem-name">${c.name}</div>
                    <div class="chem-formula">${c.formula}</div>
                    <div class="chem-uses">${c.uses}</div>
                `;
                grid.appendChild(card);
            });
        }

        search.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = chemicalsData.filter(c => 
                c.name.toLowerCase().includes(val) || 
                c.formula.toLowerCase().includes(val) || 
                c.uses.toLowerCase().includes(val)
            );
            displayChemicals(filtered);
        });

        // Initialize view layout instantly
        displayChemicals(chemicalsData);
    </script>
</body>
</html>
